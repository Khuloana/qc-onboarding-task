<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueryCrest - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>QueryCrest</h1>
            <p class="subtitle">Application Manager</p>

            <div class="tabs">
                <button
                    type="button"
                    id="loginTab"
                    class="tab active"
                >
                    Login
                </button>

                <button
                    type="button"
                    id="signupTab"
                    class="tab"
                >
                    Sign Up
                </button>
            </div>

            <div id="loginMessage" class="message"></div>

            <form id="loginForm" class="form active">
                <div class="form-group">
                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    id="loginBtn"
                    class="submit-btn"
                >
                    Login
                </button>
            </form>

            <div id="signupMessage" class="message"></div>

            <form id="signupForm" class="form">
                <div class="form-group">
                    <label for="firstName">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        autocomplete="given-name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="lastName">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        autocomplete="family-name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signupEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="e.g. 0812345678"
                        autocomplete="tel"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        autocomplete="new-password"
                        required
                    >

                    <p class="password-note">
                        Password must not be empty.
                    </p>
                </div>

                <button
                    type="submit"
                    id="signupBtn"
                    class="submit-btn"
                >
                    Create Account
                </button>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
