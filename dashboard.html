<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Manager</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
            min-height: 100vh;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
        }

        .header-content {
            max-width: 1000px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        header h1 {
            font-size: 24px;
        }

        #logoutBtn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        #logoutBtn:hover {
            background: #b91c1c;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-bottom: 20px;
            color: #1f2937;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        .button-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        #saveDraftBtn {
            background: #6b7280;
            color: white;
        }

        #submitBtn {
            background: #2563eb;
            color: white;
        }

        #saveDraftBtn:hover {
            background: #4b5563;
        }

        #submitBtn:hover {
            background: #1d4ed8;
        }

        .message {
            display: none;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 6px;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .application {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .application h3 {
            margin-bottom: 10px;
            color: #111827;
        }

        .application p {
            margin: 6px 0;
        }

        .status {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
            margin-top: 5px;
        }

        .status.draft {
            background: #fef3c7;
            color: #92400e;
        }

        .status.submitted {
            background: #dcfce7;
            color: #166534;
        }

        #loadingMessage {
            text-align: center;
            color: #6b7280;
        }

        #noApplications {
            text-align: center;
            color: #6b7280;
            padding: 20px;
        }

        @media (max-width: 600px) {
            .header-content {
                flex-direction: column;
                align-items: stretch;
            }

            #logoutBtn {
                width: 100%;
            }

            .button-row {
                flex-direction: column;
            }

            .button-row button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Application Manager</h1>
            <button id="logoutBtn">Logout</button>
        </div>
    </header>

    <main>
        <section class="card">
            <h2>Add Application</h2>
            <div id="formMessage" class="message"></div>

            <form id="applicationForm">
                <div class="form-group">
                    <label for="institution">Institution</label>
                    <select id="institution" required>
                        <option value="">Select an institution</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <input
                        type="text"
                        id="course"
                        placeholder="Enter your course"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="academicYear">Academic Year</label>
                    <select id="academicYear" required>
                        <option value="">Select academic year</option>
                        <option value="2026">2026</option>
                        <option value="2027">2027</option>
                        <option value="2028">2028</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea
                        id="notes"
                        placeholder="Optional notes"
                    ></textarea>
                </div>

                <div class="button-row">
                    <button type="button" id="saveDraftBtn">
                        Save as Draft
                    </button>
                    <button type="button" id="submitBtn">
                        Submit Application
                    </button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2>My Applications</h2>

            <div id="loadingMessage">
                Loading applications...
            </div>

            <div id="noApplications" style="display: none;">
                You don't have any applications yet.
            </div>

            <div id="applicationsList"></div>
        </section>
    </main>

    <script src="dashboard.js"></script>
</body>
</html>
